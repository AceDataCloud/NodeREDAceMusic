name: Test and publish Node-RED node
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*', 'media-v*']
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm pack --dry-run
      - run: npm pack ./media --dry-run
      - name: Publish tagged package
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
          npm publish --access public
      - name: Publish tagged media package
        if: startsWith(github.ref, 'refs/tags/media-v')
        working-directory: media
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          test "media-v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
          npm publish --access public
